<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mountain Dither Studio</title>

    <!-- Google Fonts: Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▲</text></svg>">
    <link rel="stylesheet" href="/static/style.css">

    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dither">
</head>

<body>

    <header>
        <h1>DITHER STUDIO</h1>
        <p class="subtitle">Image & Camera Dithering Engine</p>
    </header>

    <main class="main-layout">
        <div class="viewport-card">
            <span id="statusBadge" class="badge">CAMERA</span>
            <span id="recBadge" class="rec-badge">● REC 00:00</span>
            <canvas id="displayCanvas"></canvas>
            <video id="videoElement" autoplay playsinline></video>
        </div>

        <!-- Primary Actions: Photo & Video Capture -->
        <div class="action-row">
            <button id="btnCapture">GADAIGHE</button>
            <button id="btnRecord">REC VIDEO</button>
        </div>

        <div class="control-panel">
            <!-- Source & Mirror Buttons -->
            <div class="control-group">
                <label>Input Source & Camera Controls</label>
                <div class="button-grid">
                    <button id="btnCamera" class="active">Camera</button>
                    <button id="btnFlipCam">Cam: Front</button>
                    <button id="btnMirror">Mirror: Off</button>
                    <label class="file-label">
                        Upload
                        <input type="file" id="fileInput" accept="image/*,video/*">
                    </label>
                </div>
            </div>

            <div class="control-row">
                <!-- Dynamic Algorithm Selector -->
                <div class="control-group">
                    <label for="algoSelect">Algorithm</label>
                    <select id="algoSelect">
                        <option value="bayer">Bayer Matrix</option>
                        <option value="floyd_steinberg">Floyd-Steinberg</option>
                    </select>
                </div>

                <!-- Palette Selector -->
                <div class="control-group">
                    <label for="paletteSelect">Palette</label>
                    <select id="paletteSelect">
                        <option value="monochrome">1-Bit Monochrome</option>
                        <option value="gameboy">Game Boy</option>
                        <option value="cga_cyberpunk">CGA Cyberpunk</option>
                        <option value="epaper_6color" selected>e-Paper (6 Color)</option>
                    </select>
                </div>
            </div>

            <div class="control-row">
                <!-- Bayer Matrix Size -->
                <div class="control-group" id="matrixGroup">
                    <label for="matrixSelect">Matrix Size</label>
                    <select id="matrixSelect">
                        <option value="2">2x2</option>
                        <option value="4">4x4</option>
                        <option value="8" selected>8x8</option>
                    </select>
                </div>

                <!-- Downscale / Pixelation -->
                <div class="control-group">
                    <label for="scaleSlider">Downscale (<span id="scaleVal">1</span>x)</label>
                    <input type="range" id="scaleSlider" min="1" max="8" value="1" step="1">
                </div>
            </div>

            <div class="control-row">
                <!-- Contrast -->
                <div class="control-group">
                    <label for="contrastSlider">Contrast (<span id="contrastVal">1.0</span>)</label>
                    <input type="range" id="contrastSlider" min="0.5" max="2.0" value="1.0" step="0.1">
                </div>

                <!-- Brightness -->
                <div class="control-group">
                    <label for="brightnessSlider">Brightness (<span id="brightnessVal">0</span>)</label>
                    <input type="range" id="brightnessSlider" min="-50" max="50" value="0" step="5">
                </div>
            </div>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>

</html>
