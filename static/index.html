<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dither Studio</title>

    <!-- Google Fonts: Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* ============================================================
               STATIC MOUNTAIN BACKGROUND PATH
               Because your image is inside the 'static' folder, use:
               /static/mountain.jpg
               ============================================================ */
            --bg-image: url('/static/mountain.jpg');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #000000;
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #aaaaaa;
            letter-spacing: 1px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 720px;
            width: 100%;
        }

        /* Viewport styling */
        .viewport-card {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #ffffff;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .viewport-card canvas {
            width: 100%;
            height: auto;
            max-height: 480px;
            object-fit: contain;
            display: block;
            image-rendering: pixelated;
        }

        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
        }

        /* Controls Panel */
        .control-panel {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #ffffff;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .control-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 500px) {
            .control-row {
                grid-template-columns: 1fr;
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        select,
        input[type="range"],
        button {
            font-family: 'Space Grotesk', sans-serif;
            background: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            outline: none;
            transition: background 0.2s, color 0.2s;
        }

        select:focus,
        input[type="range"]:focus {
            border-color: #ffffff;
            background: #111111;
        }

        button {
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #ffffff;
            color: #000000;
        }

        button.active {
            background: #ffffff;
            color: #000000;
        }

        .button-grid {
            display: flex;
            gap: 8px;
        }

        .button-grid button,
        .button-grid label {
            flex: 1;
            text-align: center;
        }

        .file-label {
            font-family: 'Space Grotesk', sans-serif;
            background: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
        }

        .file-label:hover {
            background: #ffffff;
            color: #000000;
        }

        .file-label input {
            display: none;
        }

        /* Range Slider Styling */
        input[type="range"] {
            -webkit-appearance: none;
            height: 6px;
            background: #333333;
            border-radius: 3px;
            border: none;
            padding: 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            border: 1px solid #000000;
        }

        video {
            display: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>DITHER STUDIO</h1>
        <p class="subtitle">Image & Camera Dithering Engine</p>
    </header>

    <main class="main-layout">
        <!-- Viewport -->
        <div class="viewport-card">
            <span id="statusBadge" class="badge">CAMERA</span>
            <canvas id="displayCanvas"></canvas>
            <video id="videoElement" autoplay playsinline></video>
        </div>

        <!-- Controls -->
        <div class="control-panel">
            <!-- Source & Mirror Buttons -->
            <div class="control-group">
                <label>Input Source</label>
                <div class="button-grid">
                    <button id="btnCamera" class="active">Camera</button>
                    <button id="btnMirror">Mirror: Off</button>
                    <label class="file-label">
                        Upload
                        <input type="file" id="fileInput" accept="image/*">
                    </label>
                </div>
            </div>

            <div class="control-row">
                <!-- Dynamic Algorithm Selector -->
                <div class="control-group">
                    <label for="algoSelect">Algorithm</label>
                    <select id="algoSelect">
                        <option value="bayer">Bayer Matrix</option>
                        <option value="floyd_steinberg">Floyd-Steinberg</option>
                    </select>
                </div>

                <!-- Palette Selector -->
                <div class="control-group">
                    <label for="paletteSelect">Palette</label>
                    <select id="paletteSelect">
                        <option value="monochrome">1-Bit Monochrome</option>
                        <option value="gameboy">Game Boy</option>
                        <option value="cga_cyberpunk">CGA Cyberpunk</option>
                        <option value="epaper_6color">e-Paper (6 Color)</option>
                    </select>
                </div>
            </div>

            <div class="control-row">
                <!-- Bayer Matrix Size -->
                <div class="control-group" id="matrixGroup">
                    <label for="matrixSelect">Matrix Size</label>
                    <select id="matrixSelect">
                        <option value="2">2x2</option>
                        <option value="4" selected>4x4</option>
                        <option value="8">8x8</option>
                    </select>
                </div>

                <!-- Downscale / Pixelation -->
                <div class="control-group">
                    <label for="scaleSlider">Downscale (<span id="scaleVal">2</span>x)</label>
                    <input type="range" id="scaleSlider" min="1" max="8" value="2" step="1">
                </div>
            </div>

            <div class="control-row">
                <!-- Contrast -->
                <div class="control-group">
                    <label for="contrastSlider">Contrast (<span id="contrastVal">1.0</span>)</label>
                    <input type="range" id="contrastSlider" min="0.5" max="2.0" value="1.0" step="0.1">
                </div>

                <!-- Brightness -->
                <div class="control-group">
                    <label for="brightnessSlider">Brightness (<span id="brightnessVal">0</span>)</label>
                    <input type="range" id="brightnessSlider" min="-50" max="50" value="0" step="5">
                </div>
            </div>

            <button id="btnCapture">Save Snapshot</button>
        </div>
    </main>

    <script>
        // DOM Elements
        const video = document.getElementById('videoElement');
        const displayCanvas = document.getElementById('displayCanvas');
        const ctx = displayCanvas.getContext('2d');
        const statusBadge = document.getElementById('statusBadge');

        const btnCamera = document.getElementById('btnCamera');
        const btnMirror = document.getElementById('btnMirror');
        const fileInput = document.getElementById('fileInput');
        const btnCapture = document.getElementById('btnCapture');

        const algoSelect = document.getElementById('algoSelect');
        const paletteSelect = document.getElementById('paletteSelect');
        const matrixSelect = document.getElementById('matrixSelect');
        const matrixGroup = document.getElementById('matrixGroup');

        const scaleSlider = document.getElementById('scaleSlider');
        const scaleVal = document.getElementById('scaleVal');
        const contrastSlider = document.getElementById('contrastSlider');
        const contrastVal = document.getElementById('contrastVal');
        const brightnessSlider = document.getElementById('brightnessSlider');
        const brightnessVal = document.getElementById('brightnessVal');

        // State Variables
        let mode = 'camera'; // 'camera' or 'file'
        let isMirrored = false;
        let loadedImage = null;
        let streamActive = false;
        let useFastAPI = false;

        // Offscreen Processing Canvas
        const offscreen = document.createElement('canvas');
        const bctx = offscreen.getContext('2d', { willReadFrequently: true });

        // Palettes Definitions
        const PALETTES = {
            monochrome: [[0, 0, 0], [255, 255, 255]],
            gameboy: [[15, 56, 15], [48, 98, 48], [139, 172, 15], [155, 188, 15]],
            cga_cyberpunk: [[0, 0, 0], [85, 255, 255], [255, 85, 255], [255, 255, 255]],
            epaper_6color: [[0, 0, 0], [255, 255, 255], [255, 0, 0], [0, 255, 0], [0, 0, 255], [255, 255, 0]]
        };

        // Bayer Matrices
        const BAYER_MATRICES = {
            2: [[0, 2], [3, 1]].map(r => r.map(v => (v + 0.5) / 4)),
            4: [
                [0, 8, 2, 10],
                [12, 4, 14, 6],
                [3, 11, 1, 9],
                [15, 7, 13, 5]
            ].map(r => r.map(v => (v + 0.5) / 16)),
            8: [
                [0, 32, 8, 40, 2, 34, 10, 42],
                [48, 16, 56, 24, 50, 18, 58, 26],
                [12, 44, 4, 36, 14, 46, 6, 38],
                [60, 28, 52, 20, 62, 30, 54, 22],
                [3, 35, 11, 43, 1, 33, 9, 41],
                [51, 19, 59, 27, 49, 17, 57, 25],
                [15, 47, 7, 39, 13, 45, 5, 37],
                [63, 31, 55, 23, 61, 29, 53, 21]
            ].map(r => r.map(v => (v + 0.5) / 64))
        };

        async function checkFastAPI() {
            try {
                const res = await fetch('/api/v1/algorithms');
                if (res.ok) {
                    const algos = await res.json();
                    useFastAPI = true;
                    algoSelect.innerHTML = '';
                    algos.forEach(a => {
                        const opt = document.createElement('option');
                        opt.value = a.id;
                        opt.textContent = a.name;
                        algoSelect.appendChild(opt);
                    });
                }
            } catch (err) {
                useFastAPI = false;
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                streamActive = true;
                mode = 'camera';
                statusBadge.textContent = 'CAMERA';
                btnCamera.classList.add('active');
            } catch (err) {
                statusBadge.textContent = 'CAMERA ERROR';
                streamActive = false;
            }
        }

        // Mirror Toggle Handler
        btnMirror.addEventListener('click', () => {
            isMirrored = !isMirrored;
            btnMirror.textContent = `Mirror: ${isMirrored ? 'On' : 'Off'}`;
            btnMirror.classList.toggle('active', isMirrored);
            if (mode === 'file' && loadedImage) renderFrame();
        });

        function getNearestColor(r, g, b, palette) {
            let minDist = Infinity;
            let best = palette[0];
            for (let i = 0; i < palette.length; i++) {
                const dr = r - palette[i][0];
                const dg = g - palette[i][1];
                const db = b - palette[i][2];
                const dist = dr * dr + dg * dg + db * db;
                if (dist < minDist) {
                    minDist = dist;
                    best = palette[i];
                }
            }
            return best;
        }

        function renderFrame() {
            let srcWidth = 640;
            let srcHeight = 480;

            if (mode === 'camera' && streamActive && video.readyState >= 2) {
                srcWidth = video.videoWidth;
                srcHeight = video.videoHeight;
            } else if (mode === 'file' && loadedImage) {
                srcWidth = loadedImage.width;
                srcHeight = loadedImage.height;
            } else {
                return;
            }

            const scale = parseInt(scaleSlider.value);
            const bw = Math.max(16, Math.floor(srcWidth / scale));
            const bh = Math.max(16, Math.floor(srcHeight / scale));

            displayCanvas.width = srcWidth;
            displayCanvas.height = srcHeight;
            offscreen.width = bw;
            offscreen.height = bh;

            // Draw source to offscreen canvas
            bctx.save();
            if (isMirrored && mode === 'camera') {
                bctx.translate(bw, 0);
                bctx.scale(-1, 1);
            }

            if (mode === 'camera' && streamActive) {
                bctx.drawImage(video, 0, 0, bw, bh);
            } else if (mode === 'file' && loadedImage) {
                bctx.drawImage(loadedImage, 0, 0, bw, bh);
            }
            bctx.restore();

            // Client-side Bayer Dithering
            const imgData = bctx.getImageData(0, 0, bw, bh);
            const data = imgData.data;
            const matrixKey = parseInt(matrixSelect.value);
            const matrix = BAYER_MATRICES[matrixKey] || BAYER_MATRICES[4];
            const mSize = matrix.length;
            const palette = PALETTES[paletteSelect.value] || PALETTES.monochrome;

            const contrast = parseFloat(contrastSlider.value);
            const brightness = parseInt(brightnessSlider.value);

            for (let y = 0; y < bh; y++) {
                for (let x = 0; x < bw; x++) {
                    const i = (y * bw + x) * 4;

                    let r = (data[i] - 128) * contrast + 128 + brightness;
                    let g = (data[i + 1] - 128) * contrast + 128 + brightness;
                    let b = (data[i + 2] - 128) * contrast + 128 + brightness;

                    const threshold = matrix[y % mSize][x % mSize];
                    const noise = (threshold - 0.5) * 110;

                    const nr = Math.min(255, Math.max(0, r + noise));
                    const ng = Math.min(255, Math.max(0, g + noise));
                    const nb = Math.min(255, Math.max(0, b + noise));

                    const finalCol = getNearestColor(nr, ng, nb, palette);

                    data[i] = finalCol[0];
                    data[i + 1] = finalCol[1];
                    data[i + 2] = finalCol[2];
                }
            }

            bctx.putImageData(imgData, 0, 0);

            // Upscale to display canvas
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(offscreen, 0, 0, bw, bh, 0, 0, srcWidth, srcHeight);
        }

        // Event Listeners
        scaleSlider.addEventListener('input', (e) => {
            scaleVal.textContent = e.target.value;
            if (mode === 'file') renderFrame();
        });

        contrastSlider.addEventListener('input', (e) => {
            contrastVal.textContent = e.target.value;
            if (mode === 'file') renderFrame();
        });

        brightnessSlider.addEventListener('input', (e) => {
            brightnessVal.textContent = e.target.value;
            if (mode === 'file') renderFrame();
        });

        algoSelect.addEventListener('change', () => {
            matrixGroup.style.display = algoSelect.value === 'bayer' ? 'flex' : 'none';
            if (mode === 'file') renderFrame();
        });

        paletteSelect.addEventListener('change', () => {
            if (mode === 'file') renderFrame();
        });

        matrixSelect.addEventListener('change', () => {
            if (mode === 'file') renderFrame();
        });

        btnCamera.addEventListener('click', () => {
            mode = 'camera';
            btnCamera.classList.add('active');
            statusBadge.textContent = 'CAMERA';
            if (!streamActive) startCamera();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => {
                    loadedImage = img;
                    mode = 'file';
                    btnCamera.classList.remove('active');
                    statusBadge.textContent = 'FILE';
                    renderFrame();
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        btnCapture.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `dither-${Date.now()}.png`;
            link.href = displayCanvas.toDataURL('image/png');
            link.click();
        });

        // Animation Loop for Live Camera
        function loop() {
            if (mode === 'camera') {
                renderFrame();
            }
            requestAnimationFrame(loop);
        }

        // Initialize
        checkFastAPI();
        startCamera();
        requestAnimationFrame(loop);
    </script>
</body>

</html>
